global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: characters-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.containers.internal:3500']
        labels:
          db_engine: postgres
      - targets: ['host.containers.internal:4000']
        labels:
          db_engine: mongodb
